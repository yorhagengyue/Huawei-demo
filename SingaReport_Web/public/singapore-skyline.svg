<svg xmlns="http://www.w3.org/2000/svg" width="500" height="400" viewBox="0 0 500 400">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a4365;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="buildingGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c5282;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2b6cb0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="500" height="400" fill="url(#skyGradient)" />
  
  <!-- Stars -->
  <g>
    <circle cx="50" cy="30" r="1" fill="white" opacity="0.8" />
    <circle cx="120" cy="40" r="1.5" fill="white" opacity="0.6" />
    <circle cx="200" cy="25" r="1" fill="white" opacity="0.7" />
    <circle cx="280" cy="60" r="1.2" fill="white" opacity="0.5" />
    <circle cx="350" cy="35" r="1" fill="white" opacity="0.8" />
    <circle cx="420" cy="50" r="1.3" fill="white" opacity="0.7" />
    <circle cx="470" cy="30" r="1" fill="white" opacity="0.6" />
  </g>
  
  <!-- Singapore Skyline Buildings -->
  <!-- Marina Bay Sands -->
  <rect x="120" y="150" width="60" height="160" fill="url(#buildingGradient)" />
  <rect x="190" y="150" width="60" height="160" fill="url(#buildingGradient)" />
  <rect x="260" y="150" width="60" height="160" fill="url(#buildingGradient)" />
  <rect x="110" y="150" width="220" height="20" fill="#4299e1" />
  
  <!-- Boat-like structure on top -->
  <path d="M110,150 Q220,110 330,150 Z" fill="#4299e1" />
  
  <!-- Other buildings -->
  <rect x="10" y="200" width="40" height="110" fill="#2c5282" />
  <rect x="60" y="170" width="30" height="140" fill="#3182ce" />
  <rect x="350" y="180" width="45" height="130" fill="#2c5282" />
  <rect x="410" y="210" width="35" height="100" fill="#3182ce" />
  <rect x="455" y="190" width="25" height="120" fill="#2c5282" />
  
  <!-- Singapore Flyer-like structure -->
  <circle cx="400" cy="140" r="50" stroke="#4299e1" stroke-width="2" fill="none" />
  <circle cx="400" cy="140" r="45" stroke="#4299e1" stroke-width="1" fill="none" />
  <line x1="400" y1="90" x2="400" y2="190" stroke="#4299e1" stroke-width="1" />
  <line x1="350" y1="140" x2="450" y2="140" stroke="#4299e1" stroke-width="1" />
  
  <!-- Water reflection -->
  <rect x="0" y="310" width="500" height="90" fill="#2c5282" opacity="0.5" />
  
  <!-- Text label -->
  <text x="250" y="370" font-family="Arial" font-size="12" fill="white" text-anchor="middle">Singapore Skyline</text>
</svg> 