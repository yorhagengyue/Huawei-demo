<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#172554;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a8a;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="lightGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFFF00;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Background - Night Sky -->
  <rect width="400" height="200" fill="#F8FAFC" />
  <rect width="400" height="120" y="0" fill="url(#skyGradient)" />
  
  <!-- Ground/Street -->
  <rect x="0" y="120" width="400" height="80" fill="#E2E8F0" />
  
  <!-- Street Markings -->
  <rect x="20" y="160" width="40" height="4" fill="#94A3B8" />
  <rect x="90" y="160" width="40" height="4" fill="#94A3B8" />
  <rect x="160" y="160" width="40" height="4" fill="#94A3B8" />
  <rect x="230" y="160" width="40" height="4" fill="#94A3B8" />
  <rect x="300" y="160" width="40" height="4" fill="#94A3B8" />
  <rect x="370" y="160" width="30" height="4" fill="#94A3B8" />
  
  <!-- Before - Dark Street Lamp (Left Side) -->
  <g transform="translate(90, 0)">
    <rect x="0" y="60" width="6" height="60" fill="#64748B" />
    <rect x="-5" y="60" width="16" height="4" fill="#64748B" />
    <path d="M0,60 Q3,40 6,60" stroke="#64748B" stroke-width="2" fill="none" />
    <circle cx="3" cy="38" r="6" fill="#94A3B8" />
  </g>
  
  <!-- After - Bright Street Lamp (Right Side) -->
  <g transform="translate(300, 0)">
    <rect x="0" y="60" width="6" height="60" fill="#64748B" />
    <rect x="-5" y="60" width="16" height="4" fill="#64748B" />
    <path d="M0,60 Q3,40 6,60" stroke="#64748B" stroke-width="2" fill="none" />
    <circle cx="3" cy="38" r="6" fill="#94A3B8" />
    
    <!-- Light Glow Effect -->
    <circle cx="3" cy="38" r="30" fill="url(#lightGlow)" opacity="0.8" />
    <circle cx="3" cy="38" r="6" fill="#FFFFE0" />
    
    <!-- Beam of Light -->
    <path d="M3,38 L-15,120 L21,120 Z" fill="#FFFF0030" />
  </g>
  
  <!-- Worker icon -->
  <g transform="translate(200, 100)">
    <circle cx="0" cy="-20" r="15" fill="#3B82F6" />
    <rect x="-5" y="-5" width="10" height="15" fill="#3B82F6" />
    <line x1="0" y1="10" x2="-10" y2="25" stroke="#3B82F6" stroke-width="3" />
    <line x1="0" y1="10" x2="10" y2="25" stroke="#3B82F6" stroke-width="3" />
    <line x1="0" y1="0" x2="-15" y2="5" stroke="#3B82F6" stroke-width="3" />
    <line x1="0" y1="0" x2="15" y2="5" stroke="#3B82F6" stroke-width="3" />
    <circle cx="0" cy="-25" r="5" fill="#93C5FD" />
    
    <!-- Holding a lightbulb -->
    <circle cx="18" cy="-5" r="7" fill="#FFFFE0" stroke="#64748B" />
  </g>
  
  <!-- Check mark for completion -->
  <circle cx="355" cy="30" r="20" fill="#22C55E" />
  <path d="M345,30 L355,40 L370,20" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Caution sign by the broken lamp -->
  <path d="M90,110 L80,130 L100,130 Z" fill="#FCD34D" stroke="#B45309" stroke-width="1" />
  <text x="90" y="125" font-family="Arial" font-size="12" text-anchor="middle" fill="#B45309">!</text>
  
  <!-- Labels -->
  <text x="90" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#0F172A">Before</text>
  <text x="300" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#0F172A">After</text>
  
  <!-- Title -->
  <text x="200" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#0F172A">Street Light Replacement</text>
</svg> 