<svg xmlns="http://www.w3.org/2000/svg" width="400" height="200" viewBox="0 0 400 200">
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#BFDBFE;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grassGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#86EFAC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ADE80;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background - Sky -->
  <rect width="400" height="200" fill="url(#skyGradient)" />
  
  <!-- Ground/Grass -->
  <rect x="0" y="120" width="400" height="80" fill="url(#grassGradient)" />
  
  <!-- Path through the park -->
  <path d="M0,140 C50,130 100,150 150,140 C200,130 250,150 300,140 C350,130 400,140 400,140 L400,160 L0,160 Z" fill="#FAFAFA" />
  
  <!-- Before (Left Side): Dirty park with trash -->
  <g transform="translate(0, 0)">
    <!-- Trash -->
    <rect x="20" y="100" width="15" height="20" fill="#9CA3AF" stroke="#4B5563" />
    <rect x="50" y="110" width="10" height="10" fill="#F87171" />
    <circle cx="70" cy="115" r="5" fill="#60A5FA" />
    <path d="M30,130 L40,125 L50,130" stroke="#4B5563" stroke-width="2" fill="none" />
    
    <!-- Dead Plants -->
    <line x1="30" y1="110" x2="30" y2="95" stroke="#78716C" stroke-width="2" />
    <path d="M30,95 C25,90 35,90 30,95" stroke="#78716C" stroke-width="2" fill="none" />
    
    <line x1="60" y1="105" x2="60" y2="85" stroke="#78716C" stroke-width="2" />
    <path d="M60,85 C55,80 65,80 60,85" stroke="#78716C" stroke-width="2" fill="none" />
    
    <!-- Bench with graffiti -->
    <rect x="80" y="105" width="40" height="5" fill="#7C3AED" />
    <rect x="85" y="110" width="5" height="10" fill="#7C3AED" />
    <rect x="110" y="110" width="5" height="10" fill="#7C3AED" />
  </g>
  
  <!-- After (Right Side): Clean park -->
  <g transform="translate(200, 0)">
    <!-- Clean area -->
    <circle cx="90" cy="110" r="30" fill="#C7D2FE" opacity="0.3" />
    
    <!-- Flowers -->
    <g transform="translate(70, 100)">
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#15803D" stroke-width="1.5" />
      <circle cx="0" cy="-18" r="3" fill="#F472B6" />
      <circle cx="2" cy="-20" r="3" fill="#F472B6" />
      <circle cx="-2" cy="-20" r="3" fill="#F472B6" />
    </g>
    
    <g transform="translate(85, 95)">
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#15803D" stroke-width="1.5" />
      <circle cx="0" cy="-18" r="3" fill="#FCD34D" />
      <circle cx="2" cy="-20" r="3" fill="#FCD34D" />
      <circle cx="-2" cy="-20" r="3" fill="#FCD34D" />
    </g>
    
    <g transform="translate(100, 105)">
      <line x1="0" y1="0" x2="0" y2="-15" stroke="#15803D" stroke-width="1.5" />
      <circle cx="0" cy="-18" r="3" fill="#38BDF8" />
      <circle cx="2" cy="-20" r="3" fill="#38BDF8" />
      <circle cx="-2" cy="-20" r="3" fill="#38BDF8" />
    </g>
    
    <!-- Clean Bench -->
    <rect x="80" y="105" width="40" height="5" fill="#A1A1AA" />
    <rect x="85" y="110" width="5" height="10" fill="#A1A1AA" />
    <rect x="110" y="110" width="5" height="10" fill="#A1A1AA" />
    
    <!-- Trash Can -->
    <rect x="125" y="100" width="15" height="20" rx="2" fill="#4B5563" />
  </g>
  
  <!-- Worker with cleaning equipment -->
  <g transform="translate(180, 100)">
    <circle cx="0" cy="-15" r="12" fill="#22C55E" /> <!-- Body -->
    <rect x="-5" y="-3" width="10" height="13" fill="#22C55E" />
    <line x1="0" y1="10" x2="-8" y2="20" stroke="#22C55E" stroke-width="3" />
    <line x1="0" y1="10" x2="8" y2="20" stroke="#22C55E" stroke-width="3" />
    <circle cx="0" cy="-20" r="5" fill="#86EFAC" /> <!-- Head -->
    
    <!-- Broom -->
    <line x1="15" y1="-10" x2="15" y2="20" stroke="#7C2D12" stroke-width="2" />
    <path d="M15,20 L25,30 L5,30 Z" fill="#FEF3C7" />
  </g>
  
  <!-- Sun -->
  <circle cx="350" cy="30" r="20" fill="#FDBA74" />
  <circle cx="350" cy="30" r="15" fill="#FB923C" />
  
  <!-- Check mark for completion -->
  <circle cx="350" cy="80" r="20" fill="#22C55E" />
  <path d="M340,80 L350,90 L365,70" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Warning sign in dirty area -->
  <path d="M40,70 L30,90 L50,90 Z" fill="#FEF08A" stroke="#B45309" />
  <text x="40" y="85" font-family="Arial" font-size="12" text-anchor="middle" fill="#B45309">!</text>
  
  <!-- Labels -->
  <text x="100" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#1E293B">Before</text>
  <text x="300" y="150" font-family="Arial" font-size="12" text-anchor="middle" fill="#1E293B">After</text>
  
  <!-- Title -->
  <text x="200" y="180" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold" fill="#1E293B">Park Cleanup Initiative</text>
</svg> 